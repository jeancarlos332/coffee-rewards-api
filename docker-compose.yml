services:
  postgres:
    image: postgres:16
    container_name: coffee-rewards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_rewards
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: